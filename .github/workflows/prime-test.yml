name: prime-test
on:
  push:
    branches: [prime-test]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install yfinance pandas xlrd requests
      - run: python tools/fetch_prime.py out
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -f out && git commit -qm "out [skip ci]" && git push
