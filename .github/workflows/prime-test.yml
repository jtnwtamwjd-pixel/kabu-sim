name: prime-test
on:
  push:
    branches: [prime-test]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install yfinance pandas requests
      - run: mkdir -p out2 && (python tools/fetch_profile.py out2/profile.json out/manifest.json 2>&1 | grep -v Warning | tee out2/log.txt) || true
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -f out2 && git commit -qm "out2 [skip ci]" && git pull --rebase -X theirs && git push
