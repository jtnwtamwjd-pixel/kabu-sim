<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>兜町トレーダー</title>
<meta name="theme-color" content="#07090f">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090f;--bg2:#0c1018;--card:rgba(255,255,255,.035);--card2:rgba(255,255,255,.06);--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
  --tx:#f2f5fa;--sub:#8a93a6;--mute:#5b6476;
  --up:#ff4d6d;--dn:#18d18c;--upbg:rgba(255,77,109,.14);--dnbg:rgba(24,209,140,.13);
  --acc:#8b7bff;--acc2:#3ed6ff;--gold:#ffc65c;--blue:#4cc3ff;
  --grad:linear-gradient(120deg,#8b7bff 0%,#3ed6ff 100%);
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Inter","Noto Sans JP",-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif;font-size:15px;letter-spacing:.01em}
body{min-height:100vh;overscroll-behavior:none;background:
  radial-gradient(900px 500px at 85% -10%,rgba(139,123,255,.16),transparent 60%),
  radial-gradient(700px 420px at -10% 10%,rgba(62,214,255,.10),transparent 60%),var(--bg);background-attachment:fixed}
button{font:inherit;color:inherit;border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:10px 12px;cursor:pointer;transition:background .15s,transform .08s,border-color .15s}
button:hover{border-color:var(--line2)}
button:active{transform:scale(.97)}
button:disabled{opacity:.35;pointer-events:none}
input,select{font:inherit;color:var(--tx);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:9px 10px;outline:none}
input:focus{border-color:var(--acc)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.up{color:var(--up)}.dn{color:var(--dn)}.sub{color:var(--sub)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.hide{display:none!important}
.glass{background:var(--card);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
/* menu */
#menu{padding-bottom:48px}
.logo{padding:34px 2px 4px;display:flex;align-items:center;gap:12px}
.logo .mk{width:46px;height:46px;border-radius:14px;background:var(--grad);display:grid;place-items:center;box-shadow:0 8px 30px rgba(139,123,255,.35)}
.logo .mk svg{width:26px;height:26px}
.logo h1{margin:0;font-size:25px;font-weight:800;letter-spacing:.04em}
.logo h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo p{margin:2px 0 0;color:var(--sub);font-size:12.5px}
.ticker{overflow:hidden;white-space:nowrap;margin:16px -16px 6px;padding:8px 0;font-size:12.5px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.ticker div{display:inline-block;animation:tick 80s linear infinite;padding-left:100%}
@keyframes tick{to{transform:translateX(-100%)}}
.hero{padding:16px;margin-top:12px;display:flex;align-items:center;gap:10px}
.hero .lb{font-size:12px;color:var(--sub)}
.hero .v{font-size:26px;font-weight:800;letter-spacing:-.01em}
.sec-t{margin:26px 4px 10px;font-size:12px;color:var(--sub);letter-spacing:.14em;font-weight:600;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.scn{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;position:relative;overflow:hidden}
.scn:hover{background:var(--card2)}
.scn b{font-size:15.5px;font-weight:700}.scn .d{color:var(--sub);font-size:12.5px;margin-top:5px;line-height:1.55}
.scn .r{float:right;font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px;background:rgba(255,198,92,.12);color:var(--gold)}
.scn.feat{border:1px solid transparent;background:linear-gradient(var(--bg2),var(--bg2)) padding-box,var(--grad) border-box}
.scn.feat::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;background:radial-gradient(closest-side,rgba(139,123,255,.35),transparent);pointer-events:none}
.scn.vs{border:1px solid transparent;background:linear-gradient(#120d1c,#0d0f1a) padding-box,linear-gradient(120deg,#ff4d6d,#ffc65c) border-box}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .scn{margin:0}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
/* game header */
#hdr{position:sticky;top:0;z-index:5;background:rgba(7,9,15,.78);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding:10px 0 8px}
#hdr .top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub);gap:8px}
#hdr .top .pill{padding:3px 9px;border-radius:20px;background:var(--card2);border:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hdr .eq{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:4px;line-height:1.1}
#hdr .st{display:flex;gap:6px;font-size:12px;margin-top:8px;flex-wrap:wrap}
#hdr .st span{padding:4px 9px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--sub)}
#hdr .st b{color:var(--tx);font-weight:700;margin-left:3px}
#hdr .st b.up{color:var(--up)}#hdr .st b.dn{color:var(--dn)}
.icon-btn{width:40px;height:40px;padding:0;border-radius:12px;display:grid;place-items:center;font-size:18px}
.prog{height:3px;background:var(--line);border-radius:2px;margin-top:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--grad);transition:width .3s}
.tabs{display:flex;gap:4px;margin:12px 0 10px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.tabs button{flex:1;padding:8px 2px;font-size:13px;background:transparent;border:0;border-radius:10px;color:var(--sub);font-weight:600}
.tabs button.on{background:var(--card2);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line2)}
#main{padding-bottom:130px}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.list .it{display:flex;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);gap:10px;cursor:pointer}
.list .it:last-child{border-bottom:0}
.list .it:hover{background:rgba(255,255,255,.025)}
.it .av{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none;color:#fff;letter-spacing:-.02em}
.it .nm{flex:1;min-width:0}
.it .nm b{display:block;font-size:14.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .nm small{color:var(--sub);font-size:11.5px}
.it canvas.sp{width:58px;height:26px;flex:none}
.it .px{text-align:right;min-width:86px}
.it .px b{display:block;font-size:15px;font-weight:700}
.chg{display:inline-block;margin-top:3px;padding:2px 7px;border-radius:7px;font-size:12px;font-weight:700}
.chg.up{background:var(--upbg)}.chg.dn{background:var(--dnbg)}.chg:not(.up):not(.dn){background:var(--card2);color:var(--sub)}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;background:rgba(255,198,92,.14);color:var(--gold);margin-left:6px;vertical-align:2px}
.badge.s{background:rgba(76,195,255,.14);color:var(--blue)}
.idx{padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:12px}
.idx canvas{width:90px;height:34px}
.ctl{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:0 0 calc(12px + env(safe-area-inset-bottom));pointer-events:none}
.ctl .wrap{display:flex;gap:6px;padding:7px;background:rgba(18,22,32,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line2);border-radius:20px;box-shadow:0 12px 40px rgba(0,0,0,.5);pointer-events:auto;max-width:728px;margin:0 auto;width:calc(100% - 24px)}
.ctl button{flex:1;padding:13px 2px;font-size:14px;font-weight:700;border:0;background:rgba(255,255,255,.06);border-radius:14px}
.ctl .play{background:var(--grad);color:#0a0a14}
.ctl .play.on{background:rgba(255,255,255,.12);color:var(--tx)}
.ctl .info{flex:2;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--sub);font-weight:600}
.sortbar{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.sortbar::-webkit-scrollbar{display:none}
.sortbar button{padding:6px 12px;font-size:12.5px;border-radius:20px;white-space:nowrap;color:var(--sub);background:transparent}
.sortbar button.on{background:var(--tx);color:#0a0a14;border-color:var(--tx);font-weight:700}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;font-size:13px}
.kv div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 0}
.kv span{color:var(--sub)}
.news{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.news .n{padding:12px 16px;border-bottom:1px solid var(--line);font-size:14px;line-height:1.55}
.news .n:last-child{border-bottom:0}
.news .n small{color:var(--mute);display:block;font-size:11px;margin-bottom:2px}
.news .n.big{border-left:3px solid var(--gold)}
.news .n.me{border-left:3px solid var(--acc)}
/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(2,3,8,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(40px);opacity:.4}}
.sheet .in{background:linear-gradient(180deg,#121624,#0a0d15);border:1px solid var(--line2);border-bottom:0;border-radius:26px 26px 0 0;width:100%;max-width:760px;max-height:94vh;overflow:auto;padding:0 16px calc(22px + env(safe-area-inset-bottom));animation:rise .22s cubic-bezier(.2,.8,.2,1);box-shadow:0 -20px 60px rgba(0,0,0,.5)}
.sh-top{position:sticky;top:0;z-index:3;margin:0 -16px 6px;padding:8px 12px 10px 16px;background:linear-gradient(180deg,#121624 80%,rgba(18,22,36,0));display:flex;align-items:center;gap:10px}
.sh-top .grab{position:absolute;left:50%;top:6px;transform:translateX(-50%);width:40px;height:4px;background:var(--line2);border-radius:3px}
.sh-top .ttl{flex:1;min-width:0;padding-top:12px}
.sh-top h2{margin:0;font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-top .s2{color:var(--sub);font-size:12px}
.xbtn{flex:none;margin-top:12px;width:48px;height:48px;border-radius:50%;padding:0;display:grid;place-items:center;background:rgba(255,255,255,.1);border:1px solid var(--line2);font-size:0}
.xbtn svg{width:20px;height:20px}
.xbtn:active{background:rgba(255,255,255,.2)}
.rng{display:flex;gap:2px;margin:10px 0;padding:3px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.rng button{flex:1;padding:6px 0;font-size:12px;border:0;background:transparent;color:var(--sub);border-radius:9px;font-weight:600}
.rng button.on{background:var(--card2);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line2)}
canvas{display:block;width:100%;touch-action:none}
.trade{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:14px}
.seg{display:flex;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 2px;font-size:13.5px;background:transparent;border:0;border-radius:10px;color:var(--sub);font-weight:600}
.seg button.on.b{background:var(--up);color:#fff}
.seg button.on.s{background:var(--dn);color:#04140d}
.seg button.on.x{background:var(--blue);color:#04121a}
.qty{display:flex;gap:6px;align-items:center;margin:12px 0 8px}
.qty input{flex:1;text-align:center;font-size:20px;font-weight:800;min-width:0;padding:10px 4px}
.qty button{padding:12px 0;width:50px;font-size:12.5px;font-weight:700}
.pcts{display:flex;gap:6px;margin-bottom:8px}
.pcts button{flex:1;padding:7px 0;font-size:12px;font-weight:700;color:var(--sub)}
.go{width:100%;padding:15px;font-size:16px;font-weight:800;margin-top:10px;border:0;border-radius:15px}
.go.b{background:linear-gradient(120deg,#ff4d6d,#ff7a59);color:#fff;box-shadow:0 8px 26px rgba(255,77,109,.3)}
.go.s{background:linear-gradient(120deg,#18d18c,#3ed6c0);color:#04140d;box-shadow:0 8px 26px rgba(24,209,140,.25)}
.go.x{background:linear-gradient(120deg,#4cc3ff,#8b7bff);color:#06101c}
.go.pri{background:var(--grad);color:#0a0a14;box-shadow:0 8px 30px rgba(139,123,255,.35)}
.go.ghost{background:var(--card2);border:1px solid var(--line)}
.opt{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);gap:10px}
.opt>span{font-size:14px;white-space:nowrap}
.opt .seg{min-width:0;flex:0 1 230px}
.opt .seg button{padding:7px 2px;font-size:12.5px}
.opt .seg button.on{background:var(--tx);color:#0a0a14}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);z-index:40;background:rgba(22,26,38,.92);backdrop-filter:blur(14px);border:1px solid var(--line2);color:var(--tx);padding:11px 16px;border-radius:14px;max-width:92vw;width:max-content;font-size:13.5px;box-shadow:0 12px 40px rgba(0,0,0,.5);transition:opacity .3s}
.big-n{font-size:40px;font-weight:900;text-align:center;margin:6px 0 2px;letter-spacing:-.02em}
.rank{font-size:76px;font-weight:900;text-align:center;line-height:1;margin-top:4px;letter-spacing:-.04em}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--sub);margin:4px 0 8px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
table.tr{width:100%;border-collapse:collapse;font-size:12.5px}
table.tr td{padding:9px 6px;border-bottom:1px solid var(--line)}
.help p{line-height:1.75;font-size:14px;margin:8px 0}
.note{font-size:11.5px;color:var(--sub);line-height:1.65}
/* online */
.code{font-size:44px;font-weight:900;letter-spacing:.18em;text-align:center;margin:6px 0;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.pl{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.pl:last-child{border-bottom:0}
.pl .rk{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;background:var(--card2);flex:none}
.pl.me{background:rgba(139,123,255,.08);border-radius:12px}
.pl .rk.g1{background:linear-gradient(135deg,#ffd76b,#ff9f43);color:#1a1200}
.pl .rk.g2{background:linear-gradient(135deg,#e8edf5,#9aa6b8);color:#11151c}
.pl .rk.g3{background:linear-gradient(135deg,#f0a36b,#a8582b);color:#1a0d04}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dn);margin-right:6px;box-shadow:0 0 10px var(--dn)}
.dot.off{background:var(--mute);box-shadow:none}
.mini-board{display:flex;gap:6px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.mini-board::-webkit-scrollbar{display:none}
.mini-board span{flex:none;font-size:11.5px;padding:4px 9px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--sub)}
.mini-board span.me{border-color:var(--acc);color:var(--tx)}
</style>
</head>
<body>
<div id="menu" class="wrap"></div>
<div id="game" class="hide">
  <div id="hdr"><div class="wrap" id="hdrIn"></div></div>
  <div class="wrap" id="main"></div>
  <div class="ctl"><div class="wrap" id="ctl"></div></div>
</div>
<div id="sheet" class="sheet hide"><div class="in" id="sheetIn"></div></div>
<div id="toast" class="toast hide"></div>

let D=null; // decoded
function decode(R){
  const dates=[R.d0];let t=Date.parse(R.d0+'T00:00:00Z');
  for(let i=0;i<R.dd.length;i++){t+=(R.dd.charCodeAt(i)-48)*864e5;dates.push(new Date(t).toISOString().slice(0,10));}
  const n=dates.length,P={},DIV={},codes=[];
  for(const x of R.t){
    const a=new Float64Array(n).fill(NaN);let p=0;const ds=x.p.split(',');
    for(let i=0;i<ds.length;i++){if(ds[i])p+=parseInt(ds[i],16);a[x.s+i]=p/10;}
    P[x.c]=a;const dv={};for(const [i,v] of x.dv)dv[x.s+i]=v/100;DIV[x.c]=dv;
    if(x.c!=='N225'&&META[x.c])codes.push(x.c);
  }
  codes.sort((a,b)=>a.localeCompare(b));
  const ev={};for(const e of EVENTS){const i=idxOf(dates,e[0]);if(i>=0&&dates[i]>=e[0])(ev[i]=ev[i]||[]).push({t:e[1],big:!!e[2]});}
  // 日経平均の大きな動きと最高値を自動ニュース化
  const N=P.N225;let hi=0;
  for(let i=1;i<n;i++){
    const r=N[i]/N[i-1]-1;
    if(Math.abs(r)>=0.04&&!(ev[i]&&ev[i].length))(ev[i]=ev[i]||[]).push({t:`日経平均が${r>0?'急騰':'急落'}、前日比${r>0?'+':''}${(r*100).toFixed(1)}%（${fmt(N[i])}円）`,big:Math.abs(r)>=0.06,auto:1});
    if(N[i]>hi&&i>2500&&N[i]>38915.87&&N[i-1]<=hi&&!ev[i])(ev[i]=ev[i]||[]).push({t:`日経平均が終値で史上最高値を更新（${fmt(N[i])}円）`,auto:1});
    if(N[i]>hi)hi=N[i];
    const k=10000;if(Math.floor(N[i]/k)>Math.floor(N[i-1]/k)&&N[i]>=40000&&!ev[i]&&Math.floor(N[i]/k)*k>maxBelow(N,i,k))(ev[i]=ev[i]||[]).push({t:`日経平均が初めて${Math.floor(N[i]/k)}万円台に乗せる`,auto:1});
  }
  return {R,dates,n,P,DIV,codes,ev,last:n-1};
}
function maxBelow(N,i,k){let m=0;for(let j=0;j<i;j++)if(N[j]>m)m=N[j];return m}
function idxOf(dates,s){let lo=0,hi=dates.length-1;if(s<=dates[0])return 0;if(s>dates[hi])return hi;while(lo<hi){const m=(lo+hi)>>1;if(dates[m]<s)lo=m+1;else hi=m;}return lo}

const FEE=0.001, SHORT_RATE=0.011, MARGIN_MIN=0.3, SHORT_LEV=2;

function px(c,i=G.day){return D.P[c]?D.P[c][i]:NaN}
function listed(c,i=G.day){return isFinite(px(c,i))}
function nameOf(c){if(G&&G.set.blind){if(c==='N225')return '市場平均';return '銘柄'+G.alias[c]}return META[c][0]}
function codeLabel(c){return G&&G.set.blind?META[c][1]:c+' · '+META[c][1]}
function dateLabel(i){return G&&G.set.blind?`Day ${i-G.start+1}`:D.dates[i]}
function equity(i=G.day){let e=G.cash;for(const c in G.pos)e+=G.pos[c].q*px(c,i);return e}
function longVal(){let v=0;for(const c in G.pos)if(G.pos[c].q>0)v+=G.pos[c].q*px(c);return v}
function shortVal(){let v=0;for(const c in G.pos)if(G.pos[c].q<0)v+=-G.pos[c].q*px(c);return v}
function buyPower(){return Math.max(0,G.cash-shortVal())}
function shortRoom(){return Math.max(0,equity()*SHORT_LEV-shortVal())}
function bench(i=G.day){return D.P.N225[i]/D.P.N225[G.start]-1}
function makeAlias(){const alias={};const L='ABCDEFGHIJKLMNOPQRSTUVWXYZ';const sh=D.codes.slice().sort(()=>Math.random()-.5);sh.forEach((c,k)=>alias[c]=k<26?L[k]:L[k-26]+L[k-26]);return alias}
function scnRange(sc,set){
  let s,e;
  if(sc.rel){e=D.last;s=Math.max(0,e-sc.rel)}
  else if(sc.random){const len=set.len||sc.random;const lo=idxOf(D.dates,'2001-01-04');s=lo+Math.floor(Math.random()*(D.last-len-lo));e=s+len}
  else if(sc.free){s=idxOf(D.dates,set.from);e=Math.min(D.last,s+set.len)}
  else{s=idxOf(D.dates,sc.from);e=Math.min(D.last,idxOf(D.dates,sc.to))}
  return [s,e];
}
function blankGame(mode,scn,name,s,e,set,alias){

}
function newGame(sc,set){

}
function newLive(cap){

function saveGame(){
  if(!G||G.mode==='pvp')return;
  const o=Object.assign({},G,{startDate:D.dates[G.start],dayDate:D.dates[G.day],endDate:isFinite(G.end)?D.dates[G.end]:null,hist:G.hist.map(h=>[D.dates[h[0]],h[1]]),trades:G.trades.map(t=>Object.assign({},t,{i:D.dates[t.i]})),news:G.news.map(n=>Object.assign({},n,{i:D.dates[n.i]}))});

function loadGame(key){
  const o=LS.get(key,null);if(!o)return null;
  const f=d=>idxOf(D.dates,d);
  o.start=f(o.startDate);o.day=f(o.dayDate);o.end=o.endDate?f(o.endDate):Infinity;
  o.hist=o.hist.map(h=>[f(h[0]),h[1]]);o.trades=o.trades.map(t=>Object.assign(t,{i:f(t.i)}));o.news=o.news.map(n=>Object.assign(n,{i:f(n.i)}));
  return o;
}
function pushNews(i){const e=D.ev[i];if(!e)return null;let big=null;for(const x of e){G.news.unshift({i,t:x.t,big:x.big});if(x.big)big=x}return big||e[0]}

// 1営業日進める
function stepDay(){
  if(G.day>=G.end)return false;
  const prev=G.day,i=++G.day;
  const cd=(Date.parse(D.dates[i])-Date.parse(D.dates[prev]))/864e5;
  for(const c in G.pos){
    const p=G.pos[c],dv=D.DIV[c][i];
    if(dv){const amt=p.q*dv;G.cash+=amt;G.divs+=amt;G.news.unshift({i,t:`${nameOf(c)}の配当${p.q>0?'を受け取り':'相当額（配当落調整金）を支払い'}：${yen(Math.abs(amt))}（1株${dv}円）`,me:1});}
    if(!isFinite(px(c,i))){const last=px(c,prev);G.cash+=p.q*last;delete G.pos[c];}
  }
  const sv=shortVal();
  if(sv>0){const f=sv*SHORT_RATE*cd/365;G.cash-=f;G.fees+=f;}
  let msg=null;
  if(sv>0&&equity()<sv*MARGIN_MIN){
    for(const c in G.pos)if(G.pos[c].q<0)doTrade(c,'cover',-G.pos[c].q,true);
    msg='⚠️ 委託保証金率が30%を下回ったため、空売りを強制決済しました';G.news.unshift({i,t:msg,big:true,me:1});
  }
  G.hist.push([i,equity()]);
  const ev=G.set.blind?null:pushNews(i);
  return {ev,msg};
}

function doTrade(c,side,q,forced){
  const p=px(c);if(!isFinite(p)||q<=0)return '株価がありません';
  const amt=p*q,fee=G.set.fee?Math.round(amt*FEE):0;
  const pos=G.pos[c]||{q:0,cost:0};
  if(side==='buy'){
    if(pos.q<0)return '空売り中の銘柄は「返済買い」で決済してください';
    if(amt+fee>buyPower()+1e-6)return '買付余力が足りません';
    pos.cost=(pos.cost*pos.q+amt)/(pos.q+q);pos.q+=q;G.cash-=amt+fee;
  }else if(side==='sell'){
    if(pos.q<q)return '保有株数が足りません';
    const pl=(p-pos.cost)*q-fee;G.realized+=pl;pos.q-=q;G.cash+=amt-fee;
  }else if(side==='short'){
    if(pos.q>0)return '保有中の銘柄は空売りできません（先に売却）';
    if(!forced&&amt>shortRoom()+1e-6)return '信用余力が足りません';
    pos.cost=(pos.cost*(-pos.q)+amt)/(-pos.q+q);pos.q-=q;G.cash+=amt-fee;
  }else if(side==='cover'){
    if(-pos.q<q)return '空売り株数が足りません';
    const pl=(pos.cost-p)*q-fee;G.realized+=pl;pos.q+=q;G.cash-=amt+fee;
  }
  G.fees+=fee;
  if(pos.q===0)delete G.pos[c];else G.pos[c]=pos;
  G.trades.unshift({i:G.day,c,side,q,p,fee,forced:!!forced});
  G.hist[G.hist.length-1]=[G.day,equity()];
  saveGame();
  if(G.mode==='pvp')netReportEq();
  return null;
}

function logView(){

// ---------- 銘柄詳細 & 売買 ----------
function openDetail(c){UI.detail=c;const p=G.pos[c];UI.side=p&&p.q<0?'cover':'buy';UI.qty=null;renderDetail();}
const RANGES=[['1M',21],['3M',63],['6M',125],['1Y',245],['3Y',735],['ALL',1e9]];
function renderDetail(){
  const c=UI.detail;if(!c)return;
  const P=D.P[c],i=G.day,p=P[i],pr=P[i-1],isIdx=c==='N225';
  const i0=Math.max(firstFinite(P,0,i),i-RANGES.find(r=>r[0]===UI.range)[1]);
  const w52=P.slice(Math.max(0,i-245),i+1).filter(isFinite);
  const pos=G.pos[c];
  let h=`<div class="row" style="align-items:baseline;margin-top:2px"><b class="num" style="font-size:32px;letter-spacing:-.02em">${isIdx?fmt(p,2):pxf(p)}</b><span class="chg num ${cls(p-pr)}" style="margin-left:10px;font-size:13px">${(p-pr>0?'+':'')+fmt(p-pr,isIdx?2:1)} (${pct(p/pr-1)})</span></div>
  <div class="rng">${RANGES.map(([k])=>`<button class="${UI.range===k?'on':''}" onclick="UI.range='${k}';renderDetail()">${k}</button>`).join('')}</div>
  <canvas id="dc"></canvas>
  <div class="legend"><span><i style="background:${p>=P[i0]?'#ff4d6d':'#18d18c'}"></i>終値</span><span><i style="background:#ffc65c"></i>25日線</span><span><i style="background:#8b7bff"></i>75日線</span>${pos?'<span><i style="background:#ffc65c;height:1px"></i>平均取得</span>':''}</div>
  <div class="kv num" style="margin-top:4px"><div><span>52週高値</span><b>${pxf(Math.max(...w52))}</b></div><div><span>52週安値</span><b>${pxf(Math.min(...w52))}</b></div>
  <div><span>1ヶ月</span><b class="${cls(p/P[Math.max(0,i-21)]-1)}">${pct(p/P[Math.max(0,i-21)]-1,1)}</b></div><div><span>1年</span><b class="${cls(p/P[Math.max(0,i-245)]-1)}">${pct(p/P[Math.max(0,i-245)]-1,1)}</b></div>
  ${isIdx?'':`<div><span>配当利回り</span><b>${(yld(c)*100).toFixed(2)}%</b></div><div><span>最低購入額</span><b>${yen(p*G.set.unit)}</b></div>`}</div>`;
  if(!isIdx){
    if(pos){const pl=(p-pos.cost)*pos.q;h+=`<div class="card kv num" style="margin-top:12px"><div><span>${pos.q<0?'空売り':'保有'}</span><b>${fmt(Math.abs(pos.q))}株</b></div><div><span>平均${pos.q<0?'売建':'取得'}</span><b>${pxf(pos.cost)}</b></div><div><span>評価額</span><b>${yen(Math.abs(pos.q*p))}</b></div><div><span>評価損益</span><b class="${cls(pl)}">${yen(pl)}</b></div></div>`}
    const sides=['buy','sell'];if(G.set.short)sides.push('short','cover');
    const sd=UI.side,u=G.set.unit;
    const maxQ=maxQty(c,sd);if(UI.qty==null)UI.qty=Math.min(u,maxQ)||u;
    const q=UI.qty,amt=q*p,fee=G.set.fee?Math.round(amt*FEE):0;
    const pq=f=>Math.floor(maxQ*f/u)*u;
    h+=`<div class="trade"><div class="seg">${sides.map(s=>`<button class="${sd===s?'on '+SIDE[s][1]:''}" onclick="UI.side='${s}';UI.qty=null;renderDetail()">${SIDE[s][0]}</button>`).join('')}</div>
    <div class="qty"><button onclick="setQ(-${u*10})">-${u*10}</button><button onclick="setQ(-${u})">-${u}</button><input id="qin" class="num" inputmode="numeric" value="${q}" onchange="UI.qty=Math.max(0,Math.round((+this.value||0)/${u})*${u});renderDetail()"><button onclick="setQ(${u})">+${u}</button><button onclick="setQ(${u*10})">+${u*10}</button></div>
    <div class="pcts">${[[.25,'25%'],[.5,'50%'],[.75,'75%'],[1,'最大']].map(([f,t])=>`<button onclick="UI.qty=${pq(f)};renderDetail()">${t}</button>`).join('')}</div>
    <div class="row" style="font-size:12.5px"><span class="sub grow">約定金額（終値） <b style="color:var(--tx)">${yen(amt)}</b>${fee?` ＋手数料 ${yen(fee)}`:''}</span><span class="sub">最大 ${fmt(maxQ)}株</span></div>
    <button class="go ${SIDE[sd][1]}" ${q>0&&q<=maxQ?'':'disabled'} onclick="execTrade()">${SIDE[sd][0]}注文 ・ ${fmt(q)}株</button>
    <div class="note" style="margin-top:8px;text-align:center">${sd==='buy'?`買付余力 ${yen(buyPower())}`:sd==='short'?`信用余力 ${yen(shortRoom())}（総資産の${SHORT_LEV}倍まで・貸株料 年1.1%）`:`${sd==='sell'?'保有':'空売り'} ${fmt(pos?Math.abs(pos.q):0)}株`}</div></div>`;
  }
  h+=`<button class="go ghost" onclick="closeSheet()">閉じる</button>`;
  openSheet(h,esc(nameOf(c)),esc(isIdx?(G.set.blind?'指数':'指数（売買不可）'):codeLabel(c)));
  const up=p>=P[i0];
  const lines=[{v:P,color:up?'#ff4d6d':'#18d18c',w:1.8,label:'終値',fill:up?'rgba(255,77,109,.18)':'rgba(24,209,140,.16)'}];
  if(i-i0<=800){lines.push({v:sma(P,25,i0,i),color:'#ffc65c',w:1.1,label:'25日'});lines.push({v:sma(P,75,i0,i),color:'#8b7bff',w:1.1,label:'75日'})}
  const marks=G.trades.filter(t=>t.c===c).map(t=>({i:t.i,c:t.side==='buy'||t.side==='cover'?'#ff4d6d':'#18d18c',up:t.side==='buy'||t.side==='cover'}));
  drawChart($('dc'),{h:210,i0,i1:i,lines,marks,ref:pos?pos.cost:null,xf:dateLabel,yf:v=>isFinite(v)?(v>=100?fmt(v):v.toFixed(1)):'—'});
}
function maxQty(c,sd){
  const p=px(c),u=G.set.unit,pos=G.pos[c],f=G.set.fee?1+FEE:1;
  if(sd==='buy')return pos&&pos.q<0?0:Math.floor(buyPower()/(p*f)/u)*u;
  if(sd==='sell')return pos&&pos.q>0?pos.q:0;
  if(sd==='short')return pos&&pos.q>0?0:Math.floor(shortRoom()/p/u)*u;
  if(sd==='cover')return pos&&pos.q<0?-pos.q:0;
  return 0;
}
function setQ(d){UI.qty=Math.max(0,(UI.qty||0)+d);renderDetail()}
function execTrade(){
  const c=UI.detail,err=doTrade(c,UI.side,UI.qty);
  if(err){toast('⚠️ '+err);return}
  toast(`✅ ${esc(nameOf(c))} ${fmt(UI.qty)}株 ${SIDE[UI.side][0]}（@${pxf(px(c))}）`);
  UI.qty=null;if(!G.pos[c]&&(UI.side==='sell'||UI.side==='cover'))UI.side='buy';
  renderDetail();renderHdr();renderMain();
}

// ---------- 時間を進める ----------
function adv(n){
  let ev=null,msg=null;
  for(let k=0;k<n;k++){const r=stepDay();if(!r)break;if(r.ev)ev=r.ev;if(r.msg)msg=r.msg;if(UI.play&&((r.ev&&r.ev.big)||r.msg))break}
  saveGame();
  if(msg){toast(msg,4500);stopPlay()}
  else if(ev){toast('📰 '+esc(ev.t),ev.big?4500:2600);if(ev.big&&UI.play)stopPlay()}
  if(G.day>=G.end)stopPlay();
  refresh();
}
function refresh(){renderHdr();renderCtl();renderMain();if(UI.detail)renderDetail()}
function togglePlay(){if(UI.play)stopPlay();else{UI.play=1;UI.timer=setInterval(()=>adv(1),UI.speed||350);renderCtl()}}
function stopPlay(){UI.play=0;clearInterval(UI.timer);if(G&&G.mode!=='pvp'&&$('ctl')&&!$('game').classList.contains('hide'))renderCtl()}
function menuSheet(){
  const live=G.mode==='live',pvp=G.mode==='pvp';
  if(!pvp)stopPlay();
  let h='';
  if(!live&&!pvp)h+=`<div class="opt"><span>自動再生の速さ</span><div class="seg" id="spd">${[[700,'ゆっくり'],[350,'普通'],[120,'速い'],[30,'爆速']].map(([v,t])=>`<button class="${(UI.speed||350)===v?'on':''}" data-v="${v}">${t}</button>`).join('')}</div></div>`;
  if(pvp)h+=`<div class="card" style="margin-top:6px"><div class="sub" style="font-size:12px">ルーム</div><b class="num" style="font-size:22px;letter-spacing:.12em">${NET.code}</b></div>`;
  h+=`<button class="go ghost" onclick="closeSheet();showHelp()">遊び方</button>`;
  if(live)h+=`<button class="go ghost" onclick="if(confirm('リアル口座を解約して最初からやり直しますか？')){LS.del('kabu_live');closeSheet();renderMenu()}">口座をリセット</button>`;
  else if(pvp)h+=`<button class="go ghost" onclick="if(confirm('対戦から退出しますか？')){closeSheet();leaveRoom();renderMenu()}">対戦から退出</button>`;
  else h+=`<button class="go ghost" onclick="if(confirm('ここで終了して結果を見ますか？')){closeSheet();finish()}">ここで終了して結果を見る</button>`;
  if(!pvp)h+=`<button class="go ghost" onclick="closeSheet();saveGame();renderMenu()">メニューに戻る${live?'':'（自動保存）'}</button>`;
  openSheet(h,'メニュー');
  const sp=$('spd');if(sp)sp.onclick=e=>{const b=e.target.closest('button');if(!b)return;UI.speed=+b.dataset.v;sp.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))};
}

// ---------- 結果 ----------
function stats(){
  const eq=equity(),ret=eq/G.init-1,b=bench(),ex=ret-b;
  let pk=0,mdd=0;for(const [,v] of G.hist){if(v>pk)pk=v;mdd=Math.max(mdd,1-v/pk)}
  const rank=ex>=0.5?'SS':ex>=0.25?'S':ex>=0.1?'A':ex>=0?'B':ex>=-0.1?'C':'D';
  return {eq,ret,b,ex,mdd,rank};
}
const RANK_C={SS:'#ff6bf0',S:'#ffc65c',A:'#ff4d6d',B:'#4cc3ff',C:'#8a93a6',D:'#5b6476'};
const RANK_T={SS:'伝説の相場師',S:'兜町の勝負師',A:'市場に勝った投資家',B:'インデックス並み',C:'もう一歩',D:'修行が必要'};
function resultChart(id){const {H,eq,b}=pfLines();drawChart($(id),{h:170,i0:0,i1:Math.max(1,H.length-1),lines:[{v:b,color:'#ffc65c',w:1.3,label:'日経'},{v:eq,color:'#8b7bff',w:2.2,label:'資産',fill:'rgba(139,123,255,.25)'}],ref:0,dotEnd:1,xf:k=>H[Math.min(k,H.length-1)]?D.dates[H[Math.min(k,H.length-1)][0]]:'',yf:v=>(v>0?'+':'')+v.toFixed(0)+'%'})}
function statsCard(s){return `<div class="card kv num"><div><span>日経平均</span><b class="${cls(s.b)}">${pct(s.b,1)}</b></div><div><span>超過リターン</span><b class="${cls(s.ex)}">${pct(s.ex,1)}</b></div>
  <div><span>最大下落率</span><b>${pct(-s.mdd,1)}</b></div><div><span>取引回数</span><b>${G.trades.length}回</b></div>
  <div><span>受取配当</span><b>${yen(G.divs)}</b></div><div><span>手数料等</span><b>${yen(G.fees)}</b></div></div>`}
function revealCard(){
  if(!G.set.blind)return '';const per={};for(const t of G.trades)per[t.c]=1;for(const c in G.pos)per[c]=1;
  return `<div class="card"><b>ブラインドの答え合わせ</b><p class="sub" style="font-size:12.5px;margin:4px 0 6px">期間：${D.dates[G.start]} 〜 ${D.dates[G.day]}</p>${Object.keys(per).map(c=>`<div class="sub" style="font-size:13px;padding:2px 0">銘柄${G.alias[c]} ＝ <b style="color:var(--tx)">${META[c][0]}</b>（${c}）</div>`).join('')||'<span class="sub">取引なし</span>'}</div>`;
}
function finish(){
  stopPlay();const s=stats();
  if(!G.done){
    G.done=1;saveGame();
    const rec=LS.get('kabu_rec',{});const r=rec[G.scn];if(!r||s.ret>r.ret)rec[G.scn]={ret:s.ret,ex:s.ex,rank:s.rank,date:new Date().toISOString().slice(0,10)};LS.set('kabu_rec',rec);
    addHist({scn:G.scnName,ret:s.ret,b:s.b,rank:s.rank});
  }
  openSheet(`<div class="rank" style="color:${RANK_C[s.rank]};text-shadow:0 0 40px ${RANK_C[s.rank]}55">${s.rank}</div><div style="text-align:center;font-weight:700">${RANK_T[s.rank]}</div>
  <div class="big-n num ${cls(s.ret)}">${pct(s.ret,1)}</div><div class="sub" style="text-align:center">${yen(G.init)} → <b style="color:var(--tx)">${yen(s.eq)}</b></div>
  <div class="card" style="margin-top:14px"><div class="legend"><span><i style="background:#8b7bff"></i>あなた</span><span><i style="background:#ffc65c"></i>日経平均</span></div><canvas id="rc"></canvas></div>
  ${statsCard(s)}${revealCard()}
  <button class="go pri" onclick="shareRes()">結果をコピー</button>
  <button class="go ghost" onclick="closeSheet();renderMenu()">メニューへ</button>`,`🏁 ${esc(G.scnName)} 終了`);
  resultChart('rc');
}
function addHist(o){const hs=LS.get('kabu_hist',[]);hs.unshift(Object.assign({from:D.dates[G.start],to:D.dates[G.day],blind:G.set.blind,at:new Date().toISOString().slice(0,10)},o));LS.set('kabu_hist',hs.slice(0,30))}
function shareRes(extra){const s=stats();const t=`兜町トレーダー「${G.scnName}」${D.dates[G.start]}〜${D.dates[G.day]}\n${extra||'ランク'+s.rank} 運用成績 ${pct(s.ret,1)}（日経平均 ${pct(s.b,1)}）\n${location.href.split('?')[0]}`;
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('コピーしました')).catch(()=>prompt('コピーしてください',t))}

  <p class="note">ゲーム内の取引は仮想のもので、投資助言ではありません。株価データは Yahoo Finance から取得した日次終値です。</p></div>`,'遊び方');

  <p class="note" style="margin-top:14px">通信はブラウザ同士の直接接続（WebRTC / PeerJS）です。うまくつながらない場合は、別のネットワーク（モバイル回線など）でお試しください。</p>`,'⚔️ オンライン対戦');
}
function saveName(){const v=($('nmIn')?$('nmIn').value:'').trim().slice(0,12)||myName();LS.set('kabu_name',v);return v}
function resetNet(){try{NET.peer&&NET.peer.destroy()}catch(e){}clearInterval(NET.timer);Object.assign(NET,{peer:null,host:false,conns:{},conn:null,code:null,myId:null,players:{},cfg:null,started:false,paused:true,speed:1000,board:[],timer:null,ended:false,lost:false})}
function leaveRoom(){
  if(NET.host)broadcast({t:'bye'});else if(NET.conn)try{NET.conn.send({t:'leave'})}catch(e){}
  setTimeout(resetNet,200);if(G&&G.mode==='pvp')G=null;
}
async function createRoom(){
  const name=saveName();
  try{await loadPeer()}catch(e){toast('⚠️ '+e.message);return}
  resetNet();NET.host=true;NET.lobby={scn:'rnd',len:245,blind:1,short:1,speed:1000,cap:10000000,unit:100};
  const tryOpen=(n)=>{
    const code=String(Math.floor(100000+Math.random()*900000));
    const peer=new Peer(ROOM_PREFIX+code);NET.peer=peer;
    peer.on('open',id=>{NET.code=code;NET.myId=id;NET.players[id]={id,name,eq:0,on:true};renderLobby()});
    peer.on('error',err=>{if(err.type==='unavailable-id'&&n<4){peer.destroy();tryOpen(n+1)}else{toast('⚠️ 接続エラー：'+err.type)}});
    peer.on('connection',c=>{
      c.on('data',d=>hostRecv(c,d));
      c.on('close',()=>{const p=NET.players[c.peer];if(p){p.on=false;if(!NET.started)delete NET.players[c.peer];delete NET.conns[c.peer];hostLobbyUpdate();if(NET.started)toast(`${esc(p.name)} が退出しました`)}});
    });
    peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
  };
  tryOpen(0);
  openSheet(`<p class="sub" style="text-align:center;padding:30px 0">ルームを準備しています…</p>`,'ルーム作成');
}
async function joinRoom(){
  const name=saveName();const code=($('codeIn').value||'').replace(/\D/g,'');
  if(code.length!==6){toast('6桁のルーム番号を入力してください');return}
  try{await loadPeer()}catch(e){toast('⚠️ '+e.message);return}
  resetNet();NET.code=code;
  const peer=new Peer();NET.peer=peer;
  openSheet(`<p class="sub" style="text-align:center;padding:30px 0">ルーム ${code} に接続しています…</p>`,'参加');
  peer.on('open',id=>{
    NET.myId=id;const c=peer.connect(ROOM_PREFIX+code,{reliable:true});NET.conn=c;
    const to=setTimeout(()=>{if(!NET.cfg&&!NET.joined){toast('⚠️ ルームが見つかりません');}},9000);
    c.on('open',()=>{c.send({t:'hello',name})});
    c.on('data',d=>{clearTimeout(to);clientRecv(d)});
    c.on('close',()=>{if(NET.ended||!NET.peer)return;NET.lost=true;toast('⚠️ ホストとの接続が切れました',4000);if(G&&G.mode==='pvp')renderCtl();else{closeSheet()}});
  });
  peer.on('error',err=>{toast(err.type==='peer-unavailable'?'⚠️ ルームが見つかりません':'⚠️ 接続エラー：'+err.type)});
}
function broadcast(m){for(const id in NET.conns){try{NET.conns[id].send(m)}catch(e){}}}
function lobbyCfgView(){const L=NET.lobby,sc=PVP_SCN.find(s=>s.id===L.scn);return {scnName:sc.name,len:sc.random?L.len:null,blind:L.blind,short:L.short,speed:L.speed}}
function hostLobbyUpdate(){
  const players=Object.values(NET.players).filter(p=>p.on).map(p=>({id:p.id,name:p.name}));
  if(!NET.started)broadcast({t:'lobby',players,cfg:lobbyCfgView(),code:NET.code});
  if(!NET.started&&$('lobbyHost'))renderLobby();
}
function hostRecv(c,d){
  if(d.t==='hello'){
    if(NET.started){c.send({t:'reject',msg:'対戦はすでに始まっています'});setTimeout(()=>c.close(),500);return}
    if(Object.keys(NET.conns).length>=7){c.send({t:'reject',msg:'ルームが満員です（最大8人）'});return}
    NET.conns[c.peer]=c;NET.players[c.peer]={id:c.peer,name:String(d.name||'ゲスト').slice(0,12),eq:0,on:true};
    hostLobbyUpdate();toast(`👋 ${esc(NET.players[c.peer].name)} が参加しました`);
  }else if(d.t==='eq'){const p=NET.players[c.peer];if(p){p.eq=+d.eq||0;p.day=d.d}}
  else if(d.t==='leave'){const p=NET.players[c.peer];if(p){p.on=false;if(!NET.started)delete NET.players[c.peer]}hostLobbyUpdate()}
}
function renderLobby(){
  const L=NET.lobby,players=Object.values(NET.players).filter(p=>p.on);
  const sc=PVP_SCN.find(s=>s.id===L.scn);
  const link=location.href.split('?')[0].split('#')[0]+'?room='+NET.code;
  let h=`<div id="lobbyHost"></div><div class="card" style="text-align:center"><div class="sub" style="font-size:12px">ルーム番号</div><div class="code num">${NET.code}</div>
  <button style="font-size:13px" onclick="copyText('${link}')">🔗 招待リンクをコピー</button></div>
  <div class="sec-t">参加者 ${players.length}/8</div><div class="card" style="padding:6px 10px">${players.map(p=>`<div class="pl ${p.id===NET.myId?'me':''}"><span class="dot"></span><b class="grow">${esc(p.name)}</b>${p.id===NET.myId?'<span class="badge">ホスト</span>':''}</div>`).join('')}</div>
  <div class="sec-t">ルール</div>
  <div class="opt"><span>相場</span><select id="pScn" style="max-width:62%">${PVP_SCN.map(s=>`<option value="${s.id}" ${s.id===L.scn?'selected':''}>${s.name}</option>`).join('')}</select></div>
  ${sc.random?segOpt(L,'len','期間',[[63,'3ヶ月'],[125,'半年'],[245,'1年']]):''}
  ${segOpt(L,'speed','進む速さ',[[2000,'2秒/日'],[1000,'1秒/日'],[500,'0.5秒'],[250,'0.25秒']])}
  ${segOpt(L,'blind','ブラインド',[[1,'オン'],[0,'オフ']])}
  ${segOpt(L,'short','空売り',[[1,'あり'],[0,'なし']])}
  <p class="note">初期資金1,000万円・100株単位・手数料0.1%。ランダム期間＋ブラインドなら、結末を知っている人がいても公平に戦えます。</p>
  <button class="go pri" onclick="hostStart()" ${players.length<2?'':''}>${players.length<2?'ひとりで開始（参加を待たずに）':'対戦開始！'}</button>`;
  UI.onClose=null;
  openSheet(h,'ルーム（ホスト）');
  UI.onClose=()=>{if(!NET.started){leaveRoom();toast('ルームを閉じました')}};
  bindSegs(L,$('sheetIn'),()=>hostLobbyUpdate());
  $('pScn').onchange=e=>{L.scn=e.target.value;hostLobbyUpdate();renderLobby()};
}
function copyText(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('コピーしました')).catch(()=>prompt('コピーしてください',t))}
function renderClientLobby(players,cfg){
  const h=`<div class="card" style="text-align:center"><div class="sub" style="font-size:12px">ルーム番号</div><div class="code num">${NET.code}</div><div class="sub" style="font-size:13px">ホストの開始を待っています…</div></div>
  <div class="sec-t">参加者 ${players.length}/8</div><div class="card" style="padding:6px 10px">${players.map((p,k)=>`<div class="pl ${p.id===NET.myId?'me':''}"><span class="dot"></span><b class="grow">${esc(p.name)}</b>${k===0?'<span class="badge">ホスト</span>':''}${p.id===NET.myId?'<span class="badge s">あなた</span>':''}</div>`).join('')}</div>
  <div class="sec-t">ルール</div><div class="card kv"><div><span>相場</span><b>${esc(cfg.scnName)}</b></div><div><span>期間</span><b>${cfg.len?Math.round(cfg.len/21)+'ヶ月':'シナリオ通り'}</b></div><div><span>ブラインド</span><b>${cfg.blind?'オン':'オフ'}</b></div><div><span>空売り</span><b>${cfg.short?'あり':'なし'}</b></div><div><span>速さ</span><b>${cfg.speed/1000}秒/日</b></div><div><span>初期資金</span><b>1,000万円</b></div></div>`;
  UI.onClose=null;openSheet(h,'ルーム');UI.onClose=()=>{if(!NET.started&&NET.peer){leaveRoom();toast('ルームから退出しました')}};
}
function hostStart(){
  const L=NET.lobby,sc=PVP_SCN.find(s=>s.id===L.scn);
  const set={cap:L.cap,fee:1,unit:L.unit,short:L.short,blind:L.blind,len:L.len};
  const [s,e]=scnRange(sc,set);
  const cfg={name:L.blind?'オンライン対戦':`対戦：${sc.name}`,startDate:D.dates[s],endDate:D.dates[e],set,alias:makeAlias()};
  NET.started=true;NET.speed=L.speed;NET.cfg=cfg;
  broadcast({t:'start',cfg,speed:L.speed});
  pvpBegin(cfg);
  NET.paused=true;renderCtl();
  let n=3;toast(`⏳ ${n}`,900);const cd=setInterval(()=>{n--;if(n>0)toast(`⏳ ${n}`,900);else{clearInterval(cd);toast('🔔 取引開始！',1200);hostSetPause(false)}},1000);
}
function pvpBegin(cfg){
  UI.onClose=null;closeSheet();stopPlay();
  const s=idxOf(D.dates,cfg.startDate),e=Math.min(D.last,idxOf(D.dates,cfg.endDate));
  G=blankGame('pvp','pvp',cfg.name,s,e,cfg.set,cfg.alias);
  for(const id in NET.players)NET.players[id].eq=G.init;
  NET.board=Object.values(NET.players).map(p=>({id:p.id,name:p.name,eq:G.init,on:true}));
  startGame();
}
function hostSetPause(v){
  NET.paused=v;clearInterval(NET.timer);
  if(!v)NET.timer=setInterval(hostTick,NET.speed);
  broadcast({t:'pause',v,speed:NET.speed});renderCtl();
}
function hostTogglePause(){hostSetPause(!NET.paused)}
function hostSpeed(){const L=[2000,1000,500,250];NET.speed=L[(L.indexOf(NET.speed)+1)%L.length];hostSetPause(NET.paused)}
function hostBoard(){NET.players[NET.myId].eq=equity();return Object.values(NET.players).map(p=>({id:p.id,name:p.name,eq:p.eq,on:p.on}))}
function hostTick(){
  if(G.day>=G.end){clearInterval(NET.timer);NET.paused=true;setTimeout(hostEnd,1500);return}
  pvpStep();
  NET.board=hostBoard();
  broadcast({t:'day',d:D.dates[G.day],board:NET.board});
  refresh();
}
function hostEnd(){NET.board=hostBoard();NET.ended=true;broadcast({t:'end',board:NET.board});refresh();showPvpResult()}
function pvpStep(){const r=stepDay();if(r){if(r.msg)toast(r.msg,4000);else if(r.ev)toast('📰 '+esc(r.ev.t),r.ev.big?4000:2400)}}
function netReportEq(){
  if(NET.host){if(NET.players[NET.myId])NET.players[NET.myId].eq=equity();return}
  if(NET.conn&&NET.conn.open)try{NET.conn.send({t:'eq',eq:equity(),d:D.dates[G.day]})}catch(e){}
}
function clientRecv(d){
  if(d.t==='lobby'){NET.joined=true;NET.code=d.code||NET.code;if(!NET.started)renderClientLobby(d.players,d.cfg)}
  else if(d.t==='reject'){toast('⚠️ '+esc(d.msg),4000);resetNet();closeSheet()}
  else if(d.t==='start'){NET.started=true;NET.cfg=d.cfg;NET.speed=d.speed;NET.paused=true;NET.players={};pvpBegin(d.cfg);toast('⚔️ 対戦開始！まもなく時間が進みます',2500)}
  else if(d.t==='pause'){NET.paused=d.v;NET.speed=d.speed;if(G&&G.mode==='pvp')renderCtl()}
  else if(d.t==='day'){
    if(!G||G.mode!=='pvp')return;
    const target=Math.min(G.end,idxOf(D.dates,d.d));
    while(G.day<target)pvpStep();
    NET.board=d.board||NET.board;netReportEq();refresh();
  }
  else if(d.t==='end'){if(!G||G.mode!=='pvp')return;while(G.day<G.end)stepDay();NET.board=d.board;NET.board.forEach(p=>{if(p.id===NET.myId)p.eq=equity()});NET.ended=true;refresh();showPvpResult()}
  else if(d.t==='bye'){if(!NET.ended){NET.lost=true;toast('⚠️ ホストがルームを閉じました',4000);if(G&&G.mode==='pvp')renderCtl();else closeSheet()}}
}
function boardRows(){return NET.board.slice().map(p=>p.id===NET.myId?Object.assign({},p,{eq:equity()}):p).sort((a,b)=>b.eq-a.eq)}
function rankView(){
  const rows=boardRows();
  return `<div class="card" style="padding:6px 10px">${rows.map((p,k)=>`<div class="pl ${p.id===NET.myId?'me':''}"><span class="rk ${k<3?'g'+(k+1):''}">${k+1}</span><div class="grow"><b>${esc(p.name)}</b>${p.id===NET.myId?' <span class="badge s">あなた</span>':''}${p.on===false?' <span class="sub" style="font-size:11px">（切断）</span>':''}<div class="sub num" style="font-size:12px">${yen(p.eq)}</div></div><b class="num ${cls(p.eq/G.init-1)}">${pct(p.eq/G.init-1)}</b></div>`).join('')}</div>
  <p class="note" style="text-align:center">順位は毎日の終値時点の総資産で更新されます。</p>`;
}
function showPvpResult(){
  const rows=boardRows(),me=rows.findIndex(p=>p.id===NET.myId)+1,s=stats();
  if(!G.done){G.done=1;addHist({scn:`オンライン対戦（${rows.length}人中${me}位）`,ret:s.ret,b:s.b,rank:me+'位'})}
  const medal=['🥇','🥈','🥉'][me-1]||'🏅';
  openSheet(`<div style="text-align:center;font-size:64px;line-height:1.1;margin-top:4px">${medal}</div><div class="big-n">${rows.length}人中 ${me}位</div>
  <div class="num ${cls(s.ret)}" style="text-align:center;font-size:20px;font-weight:800">${pct(s.ret,1)} <span class="sub" style="font-size:13px;font-weight:500">（${yen(s.eq)}）</span></div>
  <div class="sec-t">最終順位</div>${rankView()}
  <div class="card"><div class="legend"><span><i style="background:#8b7bff"></i>あなた</span><span><i style="background:#ffc65c"></i>日経平均</span></div><canvas id="rc"></canvas></div>
  ${statsCard(s)}${revealCard()}
  <button class="go pri" onclick="shareRes('${rows.length}人中${me}位')">結果をコピー</button>
  <button class="go ghost" onclick="closeSheet();leaveRoom();renderMenu()">退出してメニューへ</button>`,'🏁 対戦終了');
  resultChart('rc');
}

// ---------- 最新データの取得（公開版：data.json を毎営業日自動更新） ----------
async function checkUpdate(manual){
  if(location.protocol==='file:'){if(manual)toast(`内蔵データ：${D.R.last} 終値まで（公開版では毎営業日自動更新）`);return false}
  try{
    const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;
    const R=await r.json();
    if(R.last>D.R.last){
      if(G&&G.mode==='pvp')return false; // 対戦中は差し替えない
      D=decode(R);if(manual||G)toast(`📡 最新データ（${R.last} 終値）を読み込みました`);
      if(G&&G.mode==='live'){openLive()}else if(G&&!$('game').classList.contains('hide')){stopPlay();saveGame();G=loadGame('kabu_scn');render()}else if(!G||$('game').classList.contains('hide'))renderMenu();return true}
    if(manual)toast(`データは最新です（${D.R.last} 終値）。毎営業日の夕方に更新されます`);
  }catch(e){if(manual)toast(`最新データを取得できませんでした（内蔵データ：${D.R.last} 終値まで）`)}
  return false;
}
let rzT;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(UI.detail)renderDetail();else if(G&&!$('game').classList.contains('hide'))renderMain();else if(!G||$('game').classList.contains('hide'))renderMenu()},150)});
window.addEventListener('beforeunload',()=>{if(NET.peer)leaveRoom()});
// 起動
D=decode(JSON.parse($('pricedata').textContent));
renderMenu();
checkUpdate(false);
{const m=location.search.match(/room=(\d{6})/);if(m)onlineSheet(m[1])}
window.__K={get G(){return G},get D(){return D},UI,NET,adv,doTrade,newGame,SCN,finish,stats,equity,openLive,newLive};
</script>
